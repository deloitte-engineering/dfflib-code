# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ CONFIGURATION: release.yml                                                    ║
# ║ PURPOSE: Defines changelog categories for GitHub Release notes generation.   ║
# ║          Maps PR labels to release note sections with emoji prefixes.        ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║ USED BY: build/scripts/release-notes.cjs (mirrors these categories)          ║
# ║          release-please (release-pr.yml): release PR body, because           ║
# ║          release-please-config.json sets "changelog-type": "github"          ║
# ║                                                                              ║
# ║ CATEGORY MAPPING:                                                            ║
# ║   - Breaking: breaking                                                       ║
# ║   - Features: enhancement, feat, features                                    ║
# ║   - Bugs: bug, fix, bugfix                                                   ║
# ║   - Misc: refactor, perf, chore, ci, * (catch-all)                           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

changelog:
  categories:
    - title: 🛠 Breaking Changes
      labels:
        - breaking

    - title: 🎉 New features
      labels:
        - enhancement
        - feat
        - features

    - title: 🐛 Bug fixes
      labels:
        - bug
        - fix
        - bugfix

    - title: 📚 Miscellaneous updates
      labels:
        - refactor
        - perf
        - chore
        - ci
        - "*"
