# =============================================================================
# CONFIGURATION: labeler.yml
# PURPOSE: Defines file path patterns for automatic PR labeling based on which
#          files are changed in a pull request.
# USED BY: .github/workflows/pr-labels.yml (file labels step)
#
# HOW IT WORKS:
#   When a PR is opened or updated, the file labels step reads this file and
#   applies a label for every group of files the PR changes. Several labels
#   can apply to one PR.
#
# LABEL CATEGORIES:
#   - framework:         Salesforce source code and manifest changes
#   - ci:                CI/CD workflow changes, build scripts, Markdown files
#   - utilities, database, metadata-driven-application,
#     trigger-handler-framework, test-data-builder-framework:
#                        one label per force-app sub-folder, named after it
#   - dependencies:      submodule pointer changes (dependencies/ and .gitmodules)
#   - code-examples:     changes under the code-examples/ root folder
# =============================================================================

# -----------------------------------------------------------------------------
# LABEL: framework
# Applied when: Changes to Salesforce source code or package manifest
# -----------------------------------------------------------------------------
framework:
  - changed-files:
      - any-glob-to-any-file:
          - 'force-app/**'
          - 'manifest/**'

# -----------------------------------------------------------------------------
# LABEL: ci
# Applied when: Changes to CI/CD configuration, workflows, build scripts, or markdown files
# -----------------------------------------------------------------------------
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'build/**'
          - '**/*.md'

# -----------------------------------------------------------------------------
# LABEL: utilities
# Applied when: Changes under force-app/utilities
# -----------------------------------------------------------------------------
utilities:
  - changed-files:
      - any-glob-to-any-file:
          - 'force-app/utilities/**'

# -----------------------------------------------------------------------------
# LABEL: database
# Applied when: Changes under force-app/database (selector, unit of work, query factory)
# -----------------------------------------------------------------------------
database:
  - changed-files:
      - any-glob-to-any-file:
          - 'force-app/database/**'

# -----------------------------------------------------------------------------
# LABEL: metadata-driven-application
# Applied when: Changes under force-app/metadata-driven-application (application factory, config objects)
# -----------------------------------------------------------------------------
metadata-driven-application:
  - changed-files:
      - any-glob-to-any-file:
          - 'force-app/metadata-driven-application/**'

# -----------------------------------------------------------------------------
# LABEL: trigger-handler-framework
# Applied when: Changes under force-app/trigger-handler-framework (domain and trigger handling)
# -----------------------------------------------------------------------------
trigger-handler-framework:
  - changed-files:
      - any-glob-to-any-file:
          - 'force-app/trigger-handler-framework/**'

# -----------------------------------------------------------------------------
# LABEL: test-data-builder-framework
# Applied when: Changes under force-app/test-data-builder-framework (the unit test factory)
# -----------------------------------------------------------------------------
test-data-builder-framework:
  - changed-files:
      - any-glob-to-any-file:
          - 'force-app/test-data-builder-framework/**'

# -----------------------------------------------------------------------------
# LABEL: dependencies
# Applied when: A submodule pointer or the submodule list changes
# -----------------------------------------------------------------------------
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'dependencies/**'
          - '.gitmodules'

# -----------------------------------------------------------------------------
# LABEL: code-examples
# Applied when: Changes to any file under the code-examples/ root folder
# -----------------------------------------------------------------------------
code-examples:
  - changed-files:
      - any-glob-to-any-file:
          - 'code-examples/**'
