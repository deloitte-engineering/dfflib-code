# =============================================================================
# validate-project.yml - Salesforce Project Validation Workflow
# =============================================================================
# Purpose:  Validates the assembled tree (monolith/: force-app plus the fflib
#           submodules, built by the assemble-monolith action) together with
#           code-examples/ against the validation org for pull requests (and on
#           demand for any branch). Runs deployment validation with tests.
#           code-examples/ is validation-only: it is not a package directory in
#           sfdx-project.json and is never part of any package version.
#
# Triggers: - workflow_dispatch  (manual trigger via GitHub Actions UI; the way to
#             validate a branch that has no pull request)
#           - pull_request opened/synchronize/reopened targeting main or master
#             (when force-app/**, code-examples/**, dependencies/**, .gitmodules,
#             sfdx-project.json or the assemble script changes, so a submodule
#             bump alone triggers it)
#           There is no push trigger: a push run is keyed on the branch name and a
#           pull_request run on the PR number, so both would run against the
#           validation org for one push.
#           The deployment validation enforces the 75% code coverage gate.
#
# Concurrency:
#   A pull_request run is keyed on the PR number, a manual run on the branch name.
#   A newer run in the same group cancels the one in progress; different PRs and
#   branches run in parallel.
#
# Timeout:  The validate job stops after 90 minutes (the 60 minute --wait plus
#           setup), so a hung CLI install or auth cannot run for 6 hours.
#
# Permissions: contents: read (workflow-level; the job never writes to the repo)
#
# Secrets:  SF_BUILDCHECK_INSTANCE_URL, SF_BUILDCHECK_CLIENT_ID,
#           SF_BUILDCHECK_USERNAME and SF_BUILDCHECK_PRIVATE_KEY, read from the
#           buildcheck environment (the validate job declares it).
#
# Inputs:   None.
#
# Recovery: Fix the cause and re-run the run, or push again. A manual run
#           validates any branch.
#
# Runner:   ubuntu-24.04 (pinned)
#
# =============================================================================

# Allow parallel runs across different PRs/branches, but cancel the in-progress run of the same PR/branch
concurrency:
  group: validate-project-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

name: Validate Project Build

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main
      - master
    paths:
      - 'force-app/**'
      - 'code-examples/**'
      - 'dependencies/**'
      - '.gitmodules'
      - 'sfdx-project.json'
      - 'build/scripts/assemble-*.cjs'
      - 'build/scripts/tracked-tree.cjs'

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ JOB PIPELINE                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║ validate ─── Validates deployment against validation org with tests          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

jobs:
  # ┌──────────────────────────────────────────────────────────────────────────────┐
  # │ JOB: validate                                                                │
  # ├──────────────────────────────────────────────────────────────────────────────┤
  # │ PURPOSE:                                                                     │
  # │   Validates the assembled tree (monolith/: force-app plus the fflib         │
  # │   submodules) and code-examples/ in one deployment against the              │
  # │   validation org, RunLocalTests.                                            │
  # │                                                                              │
  # │ DEPENDENCIES: None (first and only job)                                      │
  # │                                                                              │
  # │ OUTPUTS: None                                                                │
  # │                                                                              │
  # │ FAILURE BEHAVIOR:                                                            │
  # │   Blocks — validation failure indicates code issues that must be fixed.     │
  # │                                                                              │
  # │ TECHNICAL NOTES:                                                             │
  # │   - Logs in through the sf-login action                                      │
  # │   - Validates the assembled tree (monolith/) plus code-examples/            │
  # │   - code-examples/ is validation-only, never packaged                       │
  # │   - Test level: RunLocalTests (runs all local tests)                        │
  # │   - CLI pin and login come from the sf-login action                         │
  # │   - Authenticates against the validation org                                │
  # │   - Times out after 90 minutes (60 minute --wait plus setup)                 │
  # └──────────────────────────────────────────────────────────────────────────────┘
  validate:
    name: validate-deployment
    runs-on: ubuntu-24.04
    environment: buildcheck
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The composite action fetches the pinned submodules and assembles monolith/.
      - name: Assemble the monolith
        uses: ./.github/actions/assemble-monolith

      # The pinned Salesforce CLI (from a cache) and the login live in the
      # sf-login action, the one place that knows the pin.
      - name: Install the Salesforce CLI and log in to the buildcheck org
        uses: ./.github/actions/sf-login
        with:
          instance-url: ${{ secrets.SF_BUILDCHECK_INSTANCE_URL }}
          client-id: ${{ secrets.SF_BUILDCHECK_CLIENT_ID }}
          username: ${{ secrets.SF_BUILDCHECK_USERNAME }}
          private-key: ${{ secrets.SF_BUILDCHECK_PRIVATE_KEY }}
          alias: dfflib-buildcheck

      # Validate the assembled tree and code-examples together in one deployment,
      # so the examples act as a regression check on dependencies + force-app.
      # code-examples is deliberately NOT a package directory (never packaged).
      - name: Validate Deployment
        run: |
          set -euo pipefail
          echo "🚀 Starting deployment validation..."
          echo "   Source: monolith + code-examples"
          echo "   Test level: RunLocalTests"
          echo ""
          # --wait 60 polls until the deployment completes before returning.
          # Exit code 0 = Succeeded, non-zero = any failure. No jq parsing needed.
          sf project deploy validate \
            --source-dir monolith \
            --source-dir code-examples \
            --test-level RunLocalTests \
            --target-org dfflib-buildcheck \
            --wait 60
          echo ""
          echo "✅ Deployment validation passed"