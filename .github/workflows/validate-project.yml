# =============================================================================
# validate-project.yml - Salesforce Project Validation Workflow
# =============================================================================
# Purpose:  Validates the full Salesforce project (force-app/main/default and
#           force-app/test-factory) against the buildcheck org on feature and
#           release branches. Runs deployment validation with tests.
#
# Triggers: - workflow_dispatch  (manual trigger via GitHub Actions UI)
#           - push to feature/* or release/* branches
#             (when force-app/** changes)
#           - pull_request opened/synchronize/reopened targeting main or master
#             (when force-app/** changes)
#
# Concurrency:
#   PR-scoped concurrency — both push and pull_request triggers for the same PR
#   share a concurrency group (keyed on PR number), so the second run cancels the first.
#   Pushes to branches without an open PR are keyed on branch name.
#   Different branches/PRs run in parallel.
#
# Permissions: contents: read (workflow-level; least-privilege — this job only
#              reads code and deploys to an org, never writes to the repo)
#
# Secrets:  - SF_BUILDCHECK_CLIENT_ID     Consumer Key from Connected App (buildcheck org)
#            - SF_BUILDCHECK_USERNAME      Salesforce username to authenticate as (buildcheck org)
#            - SF_BUILDCHECK_PRIVATE_KEY   Private key (RSA) for JWT signing (buildcheck org)
#            - SF_BUILDCHECK_INSTANCE_URL  Instance URL of the buildcheck org
#
# Runner:   ubuntu-24.04 (pinned)
# =============================================================================

# Allow parallel runs across different branches, but cancel concurrent runs on the same branch
concurrency:
  group: validate-project-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

name: Validate Project Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug output (org details, verbose auth). Default: false'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'feature/*'
      - 'release/*'
    paths:
      - 'force-app/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main
      - master
    paths:
      - 'force-app/**'

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ JOB PIPELINE                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║ validate ─── Validates deployment against buildcheck org with tests          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

jobs:
  # ┌──────────────────────────────────────────────────────────────────────────────┐
  # │ JOB: validate                                                                │
  # ├──────────────────────────────────────────────────────────────────────────────┤
  # │ PURPOSE:                                                                     │
  # │   Validates the full Salesforce project (force-app/main/default and         │
  # │   force-app/test-factory) against the buildcheck org with RunLocalTests.    │
  # │                                                                              │
  # │ DEPENDENCIES: None (first and only job)                                      │
  # │                                                                              │
  # │ OUTPUTS: None                                                                │
  # │                                                                              │
  # │ FAILURE BEHAVIOR:                                                            │
  # │   Blocks — validation failure indicates code issues that must be fixed.     │
  # │                                                                              │
  # │ TECHNICAL NOTES:                                                             │
  # │   - Uses JWT Bearer flow for authentication                                  │
  # │   - Validates force-app/main/default and force-app/test-factory             │
  # │   - Test level: RunLocalTests (runs all local tests)                        │
  # │   - CLI pinned to @salesforce/cli@2.137.6 for reproducible builds           │
  # │   - Authenticates against the buildcheck org (not the packaging org)        │
  # └──────────────────────────────────────────────────────────────────────────────┘
  validate:
    name: validate-deployment
    runs-on: ubuntu-24.04
    env:
      DEBUG: ${{ github.event.inputs.debug || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install Salesforce CLI (sf) - pinned to 2.137.6 for reproducible builds
      # Sets a predictable npm prefix and writes it to $GITHUB_PATH once — all
      # subsequent steps in this job inherit the path without re-exporting.
      - name: Install and Setup Salesforce CLI
        run: |
          set -euo pipefail
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g @salesforce/cli@2.137.6
          "$HOME/.npm-global/bin/sf" --version

      # Authenticate to Buildcheck Org using JWT Bearer flow
      - name: Authenticate to Buildcheck Org
        env:
          SF_CLIENT_ID: ${{ secrets.SF_BUILDCHECK_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_BUILDCHECK_USERNAME }}
          SF_PRIVATE_KEY: ${{ secrets.SF_BUILDCHECK_PRIVATE_KEY }}
          SF_INSTANCE_URL: ${{ secrets.SF_BUILDCHECK_INSTANCE_URL }}
        run: |
          set -euo pipefail
          echo "🔐 Authenticating to buildcheck org..."
          sf org login jwt \
            --instance-url "$SF_INSTANCE_URL" \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file <(echo "$SF_PRIVATE_KEY") \
            --username "$SF_USERNAME" \
            --set-default \
            -a dfflib-buildcheck \
            && echo "✅ Authentication successful." \
            || { echo "::error::Authentication failed."; exit 1; }

          if [[ "$DEBUG" == "true" ]]; then
            echo ""
            echo "🔍 Auth details:"
            sf org display --target-org dfflib-buildcheck
          fi

      # Validate deployment including test factory (lives under force-app/test-factory)
      - name: Validate Deployment
        run: |
          set -euo pipefail
          echo "🚀 Starting deployment validation..."
          echo "   Source: force-app/main/default + force-app/test-factory"
          echo "   Test level: RunLocalTests"
          echo ""
          # --wait 60 polls until the deployment completes before returning.
          # Exit code 0 = Succeeded, non-zero = any failure. No jq parsing needed.
          sf project deploy validate \
            --source-dir force-app/main/default \
            --source-dir force-app/test-factory \
            --test-level RunLocalTests \
            --target-org dfflib-buildcheck \
            --wait 60
          echo ""
          echo "✅ Deployment validation passed"

      # Informational only — coverage is enforced by Salesforce's own 75% gate
      # during sf project deploy validate above. This step does not block the pipeline.
      - name: Coverage Note (Informational)
        run: |
          echo "ℹ️  Coverage enforcement: Salesforce requires minimum 75% org-wide coverage."
          echo "    If the deployment validation above passed, the coverage threshold was met."
          echo "    Full per-class coverage metrics are available in the Salesforce org."