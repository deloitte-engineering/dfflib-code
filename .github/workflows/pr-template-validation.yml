# =============================================================================
# pr-template-validation.yml - Validate PR Template Required Fields
# =============================================================================
# Purpose:  Validates that PR authors have filled in required template fields.
#           This is a BLOCKING check - PRs cannot be merged without passing.
#
# Triggers: pull_request_target (opened, edited, synchronize, reopened). The
#           validation step stops after 5 minutes.
# Inputs:   None.
# Concurrency: pr-template-validation-<PR#>, cancel-in-progress: true: only the
#           latest title and description matter, so a newer run replaces a
#           running one. Own group, separate from pr-labels.yml.
# Secrets:  GITHUB_TOKEN only.
# Recovery: Edit the PR title or description, or push; each event re-validates.
# Runner:   ubuntu-24.04 (pinned)
# Logic:    build/scripts/pr-template.cjs (the validation and its comment) and
#           build/scripts/pr-title.cjs (the one list of title types, shared with
#           pr-labels.yml).
#
# Fresh Data:
#   Title and description are fetched from the pulls API, not the webhook
#   payload, which can hold stale values after rapid edits.
#
# Validations:
#   1. Description must be at least 10 characters (not placeholder text)
#   2. PR title prefix (conventional commit format):
#      - Title must match: <type>: <description> or <type>(<scope>): <description>
#      - Breaking change: `!` right before the colon (feat!: / fix(scope)!:)
#      - Valid types (lowercase, case-sensitive): see pr-title.cjs
#      - Missing or invalid prefix = ERROR (blocks merge)
#   3. At least one checklist item must be checked (warning only)
#
# Title-Driven Type Detection:
#   The PR type is derived automatically from the title prefix using the
#   conventional commits format (e.g., "feat: Add login page" → type: feat).
#   No manual checkbox selection is required.
#
# Sticky comment:
#   One comment per PR carries the result. It is found by a hidden marker on its
#   first line (bot-authored comments only) across all pages of comments, and
#   updated in place.
#
# Status Reporting:
#   - Always reports a status (even for bot PRs) to prevent "pending" state
#   - Bot-authored PRs (pulls API user.type == 'Bot') are auto-approved without
#     validation. The event actor is ignored: a bot pushing to or editing a
#     human PR still gets validated.
#   - Human PRs are validated against template requirements
# =============================================================================

name: PR Template Validation

on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

# Concurrency control - cancel in-progress runs for the same PR
concurrency:
  group: pr-template-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-template:
    name: Validate PR Template
    runs-on: ubuntu-24.04
    # NOTE: No 'if' condition here - job always runs to report status
    # Bot detection is handled inside the module to ensure status is always reported

    steps:
      # The modules come from the default branch.
      - name: Checkout default branch (scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: build/scripts

      - name: Validate Required Fields
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        timeout-minutes: 5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { validatePrTemplate, upsertValidationComment } = require(`${process.env.GITHUB_WORKSPACE}/build/scripts/pr-template.cjs`);
            const { owner, repo } = context.repo;

            // The webhook payload can hold a stale title/body on rapid edits.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo,
              pull_number: context.payload.pull_request.number
            });

            const result = validatePrTemplate(pr);
            core.setOutput('skipped', String(result.skipped));
            core.setOutput('valid', String(result.valid));
            core.setOutput('selected_type', result.detectedType);

            if (result.skipped) {
              console.log(`✅ Bot-authored PR (author: ${pr.user.login}), auto-approving`);
              return;
            }

            try {
              await upsertValidationComment({ github, owner, repo, prNumber: pr.number, body: result.commentBody });
            } catch (error) {
              // A comment failure must not change the validation result.
              core.warning(`Could not post/update the comment: ${error.message}`);
            }

            if (!result.valid) {
              core.setFailed('PR template validation failed. See comment for details.');
            }

      - name: Report Status
        if: always()
        env:
          VALID: ${{ steps.validate.outputs.valid }}
          SKIPPED: ${{ steps.validate.outputs.skipped }}
          TYPE: ${{ steps.validate.outputs.selected_type }}
        run: |
          if [ "$SKIPPED" == "true" ]; then
            echo "✅ PR template validation skipped (bot PR)"
            exit 0
          elif [ "$VALID" == "true" ]; then
            echo "✅ PR template validation passed"
            echo "Selected type: $TYPE"
            exit 0
          else
            echo "❌ PR template validation failed"
            exit 1
          fi
