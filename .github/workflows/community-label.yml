# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ WORKFLOW: community-label                                                     ║
# ║ PURPOSE: Labels PRs from external contributors (non-members) with 'community' ║
# ║          label to help maintainers identify contributions from the community. ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║ TRIGGERS:                                                                     ║
# ║   - pull_request_target (opened): When a new PR is opened                    ║
# ║                                                                              ║
# ║ AUTHOR ASSOCIATION CHECK:                                                    ║
# ║   Only labels PRs where author_association is NOT:                           ║
# ║   - MEMBER (org member)                                                      ║
# ║   - OWNER (repo owner)                                                       ║
# ║   - COLLABORATOR (invited collaborator)                                      ║
# ║                                                                              ║
# ║ SECURITY NOTE:                                                               ║
# ║   Uses pull_request_target for write access on fork PRs. This workflow       ║
# ║   does NOT checkout or execute untrusted PR code.                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
name: Add Community Label

on:
  pull_request_target:
    types: [ opened ]

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ JOB PIPELINE                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║ add-label ─── Adds 'community' label to external contributor PRs             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

jobs:
  # ┌──────────────────────────────────────────────────────────────────────────────┐
  # │ JOB: add-label                                                               │
  # ├──────────────────────────────────────────────────────────────────────────────┤
  # │ PURPOSE:                                                                     │
  # │   Identifies and labels PRs from external contributors to help maintainers  │
  # │   prioritize community engagement and recognize external contributions.     │
  # │                                                                              │
  # │ DEPENDENCIES: None                                                           │
  # │                                                                              │
  # │ CONDITIONAL: Only runs if author is not MEMBER, OWNER, or COLLABORATOR      │
  # │                                                                              │
  # │ OUTPUTS: None (label is applied directly to the PR)                         │
  # │                                                                              │
  # │ FAILURE BEHAVIOR:                                                            │
  # │   Non-critical — labeling failure doesn't block PR workflow.                │
  # │                                                                              │
  # │ TECHNICAL NOTES:                                                             │
  # │   - Uses GitHub Script action for label management                          │
  # │   - Requires pull-requests:write permission                                 │
  # └──────────────────────────────────────────────────────────────────────────────┘
  add-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: add-community-label
        if: github.event.pull_request.author_association != 'MEMBER' &&
          github.event.pull_request.author_association != 'OWNER' &&
          github.event.pull_request.author_association != 'COLLABORATOR'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pullRequestNumber = context.payload.pull_request.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequestNumber,
              labels: ['community']
            });
            console.log(`Added community label to PR #${pullRequestNumber}`);
