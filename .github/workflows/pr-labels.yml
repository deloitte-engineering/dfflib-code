# =============================================================================
# pr-labels.yml - All PR labelling (files, title, community)
# =============================================================================
# Purpose:  Applies every automatic PR label from ONE job whose steps run in
#           sequence, so no label write can clobber another and each PR event
#           starts exactly one run on one runner.
# Triggers: pull_request_target (opened, edited, synchronize, reopened), for every
#           author, bots included. A push cannot change the title, but its run
#           can replace a pending title-edit run, so synchronize runs the same
#           steps and the label still converges.
# Concurrency: 'pr-labels-<PR#>', cancel-in-progress false. GitHub keeps one
#           running + one pending run per group and a newer pending run replaces
#           an older one. That is safe ONLY because the file and conventional
#           label steps run on EVERY event and recompute from fresh data, so the
#           replacing run does the replaced run's work. Do not gate them by event
#           type or actor (only by PR-constant facts like the author).
#           Separate workflows sharing this group used to drop each other's
#           runs on `opened`.
# Inputs:   None.
# Secrets:  GITHUB_TOKEN only.
# Recovery: Re-run the run, or push or edit the PR again: every event recomputes
#           the labels from fresh data.
# Setup:    Every label this workflow applies must already exist in the
#           repository (the names are in labeler.yml and pr-labels.cjs); a
#           missing label fails the API call.
# Runner:   ubuntu-24.04 (pinned)
# Logic:    build/scripts/pr-labels.cjs (the conventional, breaking and community
#           decisions) and build/scripts/pr-title.cjs (the one list of title
#           types). Title and description are read fresh from the pulls API, not
#           the webhook payload, which can be stale on rapid edits.
#
# Step pipeline:
#   File labels         every event, every author.
#                       actions/labeler starts from the PR's existing labels and
#                       writes back the union with the matches (setLabels); it
#                       removes labels only with sync-labels, which is not set,
#                       so labels from other sources (for example the
#                       automation-managed `release-notes: override`) survive.
#                       It still runs first so later steps see its result.
#   Conventional label  every event, every author. One label from the PR title
#                       type, plus `breaking` from a title `!` or a
#                       `BREAKING CHANGE:` description line. Non-destructive: a
#                       title that does not follow the format, or a type with no
#                       mapped label (docs/test/build/ci/revert), leaves the conventional
#                       labels untouched, so a stale title read can never strip a
#                       correctly-applied label. pr-template-validation.yml is the
#                       single BLOCKING title check. `ci` is NOT managed here; the
#                       file labeler (labeler.yml) owns it.
#   Community label     opened only (the first run for a PR, never replaced).
#                       'community' for external contributors; never for bot
#                       authors (PR author user.type == Bot).
# =============================================================================

name: PR Labels

on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  labels:
    name: PR labels
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The modules come from the default branch.
      - name: Checkout default branch (scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: build/scripts

      - name: Add file labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # !cancelled(): a failed labeler step must not skip the title labels.
      - name: Sync conventional label from the PR title
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { syncConventionalLabels } = require(`${process.env.GITHUB_WORKSPACE}/build/scripts/pr-labels.cjs`);
            const { owner, repo } = context.repo;
            await syncConventionalLabels({
              github, owner, repo,
              prNumber: context.payload.pull_request.number,
              log: core.info,
              warn: core.warning,
            });

      # 'community' for PRs from external contributors. author_association is NOT
      # used; it under-reports org members. The module labels ONLY when the
      # repository collaborator check and the (public) org membership check both
      # say external.
      - name: Add community label
        if: ${{ !cancelled() && github.event.action == 'opened' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { syncCommunityLabel } = require(`${process.env.GITHUB_WORKSPACE}/build/scripts/pr-labels.cjs`);
            const { owner, repo } = context.repo;
            await syncCommunityLabel({
              github, owner, repo,
              pr: context.payload.pull_request,
              log: core.info,
            });
