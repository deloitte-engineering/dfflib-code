# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ WORKFLOW: add-labels (Manage Review Labels)                                   ║
# ║ PURPOSE: Manages the 'lgtm' (Looks Good To Me) label based on PR review      ║
# ║          status. Adds label when approved, removes when changes requested.    ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║ TRIGGERS:                                                                     ║
# ║   - pull_request_review (submitted): When a review is submitted              ║
# ║   - pull_request_review (dismissed): When a review is dismissed              ║
# ║                                                                              ║
# ║ LABEL BEHAVIOR:                                                              ║
# ║   - Review approved → Add 'lgtm' label                                       ║
# ║   - Changes requested → Remove 'lgtm' label                                  ║
# ║   - Review dismissed → Remove 'lgtm' label                                   ║
# ║                                                                              ║
# ║ RUNNER: ubuntu-24.04 (pinned)                                                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: Manage Review Labels

on:
  pull_request_review:
    types: [ submitted, dismissed ]

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ JOB PIPELINE                                                                  ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║ label-on-review ─── Adds/removes 'lgtm' label based on review state          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

jobs:
  # ┌──────────────────────────────────────────────────────────────────────────────┐
  # │ JOB: label-on-review                                                         │
  # ├──────────────────────────────────────────────────────────────────────────────┤
  # │ PURPOSE:                                                                     │
  # │   Provides visual indication of PR approval status via labels.              │
  # │   Helps maintainers quickly identify PRs ready for merge.                   │
  # │                                                                              │
  # │ DEPENDENCIES: None                                                           │
  # │                                                                              │
  # │ OUTPUTS: None (labels are applied directly to the PR)                       │
  # │                                                                              │
  # │ FAILURE BEHAVIOR:                                                            │
  # │   Non-critical — label management failure doesn't block PR workflow.        │
  # │   Handles 404 errors gracefully (label may already be removed).             │
  # │                                                                              │
  # │ TECHNICAL NOTES:                                                             │
  # │   - Uses GitHub Script action for flexible label management                 │
  # │   - Requires pull-requests:write and issues:write permissions               │
  # └──────────────────────────────────────────────────────────────────────────────┘
  label-on-review:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Manage LGTM Review Label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const LGTM_LABEL = 'lgtm';
            const { state: reviewState } = context.payload.review;
            const pullRequestNumber = context.payload.pull_request.number;
            const repoDetails = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequestNumber
            };

            async function hasLgtmLabel() {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue(repoDetails);
              return labels.some(label => label.name === LGTM_LABEL);
            }

            if (reviewState === 'approved') {
              if (!await hasLgtmLabel()) {
                await github.rest.issues.addLabels({ ...repoDetails, labels: [LGTM_LABEL] });
                console.log(`Added ${LGTM_LABEL} label to PR #${pullRequestNumber}`);
              }
            } else if (reviewState === 'changes_requested' || reviewState === 'dismissed') {
              try {
                await github.rest.issues.removeLabel({ ...repoDetails, name: LGTM_LABEL });
                console.log(`Removed ${LGTM_LABEL} label from PR #${pullRequestNumber}`);
              } catch (e) {
                if (e.status !== 404) {
                  throw e;
                }
                // Label may already be removed - ignore 404
              }
            }
